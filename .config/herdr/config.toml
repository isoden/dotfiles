onboarding = false

[theme]
name = "tokyo-night"

[keys]
prefix = "cmd+j"
split_horizontal = "prefix+minus"
split_vertical = "prefix+|"

[experimental]
kitty_graphics = true

[[keys.command]]
key = "prefix+L"
type = "popup"
command = "exec \"${SHELL:-sh}\""
width = "90%"
height = "90%"

[[keys.command]]
key = "prefix+H"
type = "popup"
command = "hunk diff"
width = "90%"
height = "90%"

[[keys.command]]
key = "prefix+G"
type = "popup"
command = "lazygit"
width = "90%"
height = "90%"

[[keys.command]]
key = "prefix+b"
type = "shell"
command = '"${HERDR_BIN_PATH}" plugin pane open --plugin official.browser --entrypoint browser --placement split --direction right --focus'
description = "open browser in right split"
